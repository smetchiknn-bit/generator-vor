<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>coder-app-name</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* 内联样式确保主题色立即生效，避免闪烁 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.light,
      html.light body {
        background-color: #ffffff !important;
        color: #000000;
      }
      html.dark,
      html.dark body {
        background-color: #1a1a1a !important;
        color: #ffffff;
      }
    </style>
    <script>
      // 在 React 加载前立即设置主题，避免闪烁
      (function () {
        const isInIframe = window.self !== window.top;

        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }

        if (isInIframe) {
          // 监听父窗口主动推送的主题消息
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (theme === "light" || theme === "dark") {
                applyThemeToDOM(theme);
              }
            }
          });
        } else {
          // 非 iframe 环境，使用默认 light 主题
          applyThemeToDOM("light");
        }
      })();
    </script>
      <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          // 资源加载失败的 error 事件没有 message，此处仅上报 JS 运行时错误
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return; // 相同错误只上报一次，避免渲染循环刷屏
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : ""
                }
              },
              "*"
            );
          } catch (e) {
            /* 上报失败不影响页面运行 */
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор ВОР — ведомость объёмов работ</title>
    <meta
      name="description"
      content="Автоматическое формирование Ведомости объёмов работ: привязка кодов КЕР и ТМЦ к спецификации, тройная детализация, экспорт в ВОР.xlsx"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #eef1f0;
        min-height: 100%;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          linear-gradient(rgba(27, 63, 158, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(27, 63, 158, 0.06) 1px, transparent 1px),
          #f4f6f5;
        background-size: 24px 24px, 24px 24px, auto;
        font-family: "Unbounded", "IBM Plex Sans", sans-serif;
      }
      #boot .mark {
        font-size: clamp(34px, 7vw, 64px);
        font-weight: 900;
        letter-spacing: 0.02em;
        color: #0e1823;
      }
      #boot .mark b {
        color: #d18f0a;
      }
      #boot .bar {
        width: min(300px, 62vw);
        height: 4px;
        background: rgba(14, 24, 35, 0.12);
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 36%;
        background: #f0a81c;
        animation: bootbar 1.1s ease-in-out infinite alternate;
      }
      @keyframes bootbar {
        from {
          transform: translateX(-30%);
        }
        to {
          transform: translateX(210%);
        }
      }
      #boot .cap {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #55708a;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="Загрузка приложения">
        <div class="mark">ВОР<b>·</b>ГЕН</div>
        <div class="bar"><i></i></div>
        <div class="cap">загрузка модулей…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
